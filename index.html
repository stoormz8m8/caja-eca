    <button class="btn danger" data-act="borrar" data-col="inventario" data-id="${i.id}">Borrar</button>
  </div>
  <button class="btn ghost block" data-act="cerrar">Cerrar</button>`, {type:"item", id:i.id});
}
function hojaRep(id){
  const i = S.inventario.find(x => x.id === id); if (!i) return;
  openSheet(`
  <h3>Reparación o mantenimiento</h3>
  <div class="muted" style="margin-top:-8px">${esc(i.nombre)}</div>
  <form id="fRep" class="stack" data-id="${id}" novalidate>
    <div class="field"><label for="rp-c">Concepto</label><input id="rp-c" placeholder="Ej. Limpieza de cabezal"></div>
    <div class="grid2">
      <div class="field"><label for="rp-m">Monto</label><input id="rp-m" inputmode="decimal"></div>
      <div class="field"><label for="rp-f">Fecha</label><input id="rp-f" type="date" value="${hoy()}"></div>
    </div>
    <span class="hint">Cuenta como gasto del mes en que la pagaste.</span>
    <div class="err" id="rp-err"></div>
    <button class="btn primary block" type="submit">Guardar</button>
    <button class="btn ghost block" type="button" data-act="ver-item" data-id="${id}">Volver</button>
  </form>`, {type:"form"});
}
async function guardarRep(form){
  const err = form.querySelector("#rp-err"), concepto = form.querySelector("#rp-c").value.trim(), monto = num(form.querySelector("#rp-m").value);
  if (!concepto) return err.textContent = "Escribe qué se reparó o qué mantenimiento se hizo.";
  if (!(monto > 0)) return err.textContent = "Escribe el monto.";
  await guardarItemCambio(form.dataset.id, o => o.reparaciones.push({fecha: form.querySelector("#rp-f").value || hoy(), concepto, monto}), "Reparación guardada");
}
async function guardarItemCambio(id, mut, msg){
  const i = S.inventario.find(x => x.id === id); if (!i) return;
  const o = clone(i); delete o.id; o.reparaciones = o.reparaciones || []; mut(o); o.actualizado = new Date().toISOString();
  try { await S.db.collection("inventario").doc(id).set(o); toast(msg); verItem(id); }
  catch(_){ toast("No se pudo guardar. Revisa tu conexión."); }
}

/* ---------- Exportar a Excel ---------- */
async function exportarExcel(){
  if (!window.XLSX){ toast("El exportador no cargó. Revisa tu conexión."); return; }
  const tName = id => tarjetaNombre(tarjetaDe(id));
  const evs = [...S.eventos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const hojaEv = evs.map(e=>({"Fecha":e.fecha,"Hora":e.hora||"","Cliente":e.cliente,"Teléfono":e.telefono||"","Lugar":e.lugar||"","Tipo de evento":e.tipoEvento||"",
    "Paquete":e.paquete||"","Horas":e.horas||"","Precio paquete":+e.precio||0,"Extras":sum(e.extras||[],x=>x.monto),"Total":evTotal(e),"Abonado":evAbonado(e),
    "Saldo":evSaldo(e),"Origen":e.origen||"","Costos del evento":evCostos(e),"Estado":e.estado==="cancelado"?"Cancelado":"Activo","Notas":e.notas||""}));
  const hojaAb = evs.flatMap(e=>(e.abonos||[]).map(a=>({"Fecha del abono":a.fecha,"Cliente":e.cliente,"Fecha del evento":e.fecha,"Monto":+a.monto||0,"Forma de pago":a.forma==="efectivo"?"Efectivo":"Transferencia","Nota":a.nota||""})));
  const hojaCo = evs.flatMap(e=>(e.costos||[]).map(x=>({"Fecha del evento":e.fecha,"Cliente":e.cliente,"Concepto":x.concepto,"Monto":+x.monto||0})));
  const hojaGa = [...S.gastos].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(g=>({"Fecha":g.fecha,"Hora":g.hora||"","Tipo":g.tipo==="fijo"?"Fijo":"Variable","Categoría":g.categoria,
    "Descripción":g.descripcion||"","Monto":+g.monto||0,"Forma de pago":g.metodo==="tarjeta"?"Tarjeta":(g.metodo==="transferencia"?"Transferencia":"Efectivo"),
    "Tarjeta":g.metodo==="tarjeta"?tName(g.tarjetaId):"","Meses sin intereses":(parseInt(g.msi)||1)>1?+g.msi:"","Mensualidad":(parseInt(g.msi)||1)>1?(+g.monto/g.msi):""}));
  const hojaTj = S.tarjetas.map(t=>({"Banco":t.banco,"Tarjeta":t.nombre||"","Últimos 4":t.ultimos4,"Tipo":esCredito(t)?"Crédito":"Débito","Día de corte":t.diaCorte||"","Día de pago":t.diaPago||""}));
  const yms = [...new Set([...S.eventos.map(e=>ymOf(e.fecha)), ...S.gastos.map(g=>ymOf(g.fecha)), ...S.eventos.flatMap(e=>(e.abonos||[]).map(a=>ymOf(a.fecha)))])].filter(Boolean).sort();
  S.inventario.forEach(i => { yms.push(ymOf(i.fechaCompra)); (i.reparaciones||[]).forEach(r => yms.push(ymOf(r.fecha))); });
  const ymsT = [...new Set(yms)].filter(Boolean).sort();
  const hojaRes = ymsT.map(ym=>{const r=resumen(ym);return {"Mes":mesNombre(ym),"Eventos":r.eventos,"Vendido (eventos del mes)":r.vendido,"Cobrado":r.cobrado,"Gastos (incluye insumos y reparaciones)":r.gastos,"Insumos, accesorios y reparaciones":r.insumos,"Costos de eventos":r.costos,"Te quedó":r.resultado,"Inversión en equipo":r.inversion};});
  const hojaInv = [...S.inventario].sort((a,b)=>(a.fechaCompra||"").localeCompare(b.fechaCompra||"")).map(i=>{const c=itemCalc(i);return {"Tipo":TIPOS_INV[i.tipo],"Nombre":i.nombre,"Fecha de compra":i.fechaCompra,"Costo":+i.costo||0,"Cantidad":i.cantidad||"",
    "Forma de pago":i.metodo==="tarjeta"?"Tarjeta":(i.metodo==="transferencia"?"Transferencia":"Efectivo"),"Tarjeta":i.metodo==="tarjeta"?tName(i.tarjetaId):"","Meses sin intereses":(parseInt(i.msi)||1)>1?+i.msi:"",
    "Estado":ESTADOS[i.estado||"uso"],"Fecha de baja":i.fechaBaja||"","Valor de venta":+i.valorVenta||0,"Reparaciones":c.rep,"Días de uso":c.dias,"Eventos cubiertos":c.evs,"Costo por evento":c.evs?Math.round(c.porEvento*100)/100:"","Notas":i.notas||""};});
  const wb = XLSX.utils.book_new();
  const add = (rows, name, vacio) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[vacio]), name);
  add(hojaRes,"Resumen mensual",{"Mes":"Sin datos"}); add(hojaEv,"Eventos",{"Fecha":"Sin datos"}); add(hojaAb,"Abonos",{"Fecha del abono":"Sin datos"});
  add(hojaCo,"Costos de eventos",{"Concepto":"Sin datos"}); add(hojaGa,"Gastos",{"Fecha":"Sin datos"}); add(hojaInv,"Inventario",{"Nombre":"Sin datos"}); add(hojaTj,"Tarjetas",{"Banco":"Sin datos"});
  try { XLSX.writeFile(wb, `ECA-contabilidad-${hoy()}.xlsx`); toast("Excel descargado"); }
  catch(_){ toast("No se pudo generar el Excel."); }
}

/* ---------- Borrado con confirmación ---------- */
async function borrar(btn){
  if (!btn.dataset.armed){ btn.dataset.armed = "1"; btn.dataset.txt = btn.textContent; btn.textContent = "Toca otra vez para confirmar"; setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent = btn.dataset.txt; } }, 4000); return; }
  try { await S.db.collection(btn.dataset.col).doc(btn.dataset.id).delete(); closeSheet(); toast("Borrado"); }
  catch(_){ toast("No se pudo borrar. Revisa tu conexión."); }
}

/* ---------- Eventos de interfaz ---------- */
document.addEventListener("click", async ev => {
  const tabBtn = ev.target.closest("nav.tabs button");
  if (tabBtn){ S.tab = tabBtn.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case "mes": S.mes = ymAdd(S.mes, +b.dataset.d); S.dia = null; render(); break;
    case "tab": S.tab = b.dataset.t; render(); window.scrollTo(0,0); break;
    case "dia": S.dia = b.dataset.f && b.dataset.f !== S.dia ? b.dataset.f : null; render(); break;
    case "periodo": S.periodo = b.dataset.p; render(); break;
    case "cerrar": closeSheet(); break;
    case "ajustes": if (S.db) hojaAjustes(); break;
    case "nuevo-evento": if (S.db) hojaEvento(null); break;
    case "editar-evento": hojaEvento(S.eventos.find(e=>e.id===id)); break;
    case "ver-evento": case "volver-evento": verEvento(id); break;
    case "nuevo-gasto": if (S.db) hojaGasto(null); break;
    case "editar-gasto": hojaGasto(S.gastos.find(g=>g.id===id)); break;
    case "ver-item": verItem(id); break;
    case "nuevo-item": if (S.db) hojaItem(null, b.dataset.tipo); break;
    case "editar-item": hojaItem(S.inventario.find(i=>i.id===id)); break;
    case "inv-filtro": S.invFiltro = b.dataset.f; render(); break;
    case "form-rep": hojaRep(id); break;
    case "terminar-item": {
      if (!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Toca otra vez para confirmar"; return; }
      guardarItemCambio(id, o => { o.estado = "terminado"; o.fechaBaja = hoy(); }, "Marcado como terminado"); break; }
    case "borrar-rep": {
      if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "¿Sí?"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armed"); b.textContent="✕"; } }, 4000); return; }
      const k = +b.dataset.i; guardarItemCambio(id, o => o.reparaciones.splice(k,1), "Borrado"); break; }
    case "tipo-compra": {
      const f = b.closest("form"), monto = f.querySelector("#g-monto, #it-costo")?.value || "", fecha = f.querySelector("#g-fecha, #it-fecha")?.value || hoy();
      if (b.dataset.v === "gasto") hojaGasto(null, {monto, fecha}); else hojaItem(null, b.dataset.v, {costo:monto, fechaCompra:fecha}); break; }
    case "nueva-tarjeta": if (S.db) hojaTarjeta(null); break;
    case "editar-tarjeta": hojaTarjeta(S.tarjetas.find(t=>t.id===id)); break;
    case "form-abono": hojaLinea("abonos", id); break;
    case "form-costo": hojaLinea("costos", id); break;
    case "liquidar": { const e = S.eventos.find(x=>x.id===id); hojaLinea("abonos", id, Math.round(evSaldo(e)*100)/100, "Liquidación"); break; }
    case "borrar-linea": {
      if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "¿Sí?"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armed"); b.textContent="✕"; } }, 4000); return; }
      const tipo = b.dataset.tipo, i = +b.dataset.i;
      guardarEvLineas(id, o => o[tipo].splice(i,1), "Borrado"); break; }
    case "borrar": borrar(b); break;
    case "add-extra": $("#extras").insertAdjacentHTML("beforeend", lineaExtra(b.dataset.c, b.dataset.m)); break;
    case "quitar-linea": b.closest(".line-row").remove(); break;
    case "add-paq": $("#aj-paqs").insertAdjacentHTML("beforeend", lineaPaq({nombre:"",precio:""})); break;
    case "quitar-chip": b.closest(".chip").remove(); break;
    case "add-chip": { const box = b.closest(".sub-box"), inp = box.querySelector(".add-line input"), v = inp.value.trim();
      if (v){ box.querySelector(".chips").insertAdjacentHTML("beforeend", `<span class="chip">${esc(v)}<button type="button" data-act="quitar-chip" aria-label="Quitar">✕</button></span>`); inp.value=""; inp.focus(); } break; }
    case "g-tipo": { const f = $("#fGasto"), c = cfg(); f.querySelector("#g-tipo").value = b.dataset.v;
      f.querySelectorAll('[data-act="g-tipo"]').forEach(x=>x.classList.toggle("on", x===b));
      f.querySelector("#g-cat").innerHTML = catOpts(b.dataset.v==="fijo"?c.fijos:c.variables, ""); syncGastoForm(); break; }
    case "excel": exportarExcel(); break;
    case "sync": S.slow = false; render(); sincronizar(false); break;
    case "actualizar": closeSheet(); toast("Actualizando…"); sincronizar(false); break;
    case "desconectar": desconectar(b); break;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "ev-paq"){ const o = t.selectedOptions[0]; if (o && o.dataset.precio){ $("#ev-precio").value = o.dataset.precio; $("#ev-horas").value = o.dataset.horas; } }
  if (t.closest("#fGasto")) syncGastoForm();
  if (t.id === "tj-clase") syncTarjetaForm();
  if (t.closest("#fItem")) syncItemForm();
});
document.addEventListener("input", ev => { if (ev.target.closest("#fGasto") && ev.target.id==="g-monto") syncGastoForm(); if (ev.target.id==="it-costo") syncItemForm(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && S.sheet) closeSheet();
  if (ev.key === "Enter" && ev.target.closest(".add-line")){ ev.preventDefault(); ev.target.closest(".add-line").querySelector("button").click(); }
});
document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target, btn = f.querySelector('button[type="submit"]');
  if (btn.disabled) return; btn.disabled = true;
  try {
    if (f.id === "fSetup") await conectarSetup(f);
    else if (f.id === "fEvento") await guardarEvento(f);
    else if (f.id === "fGasto") await guardarGasto(f);
    else if (f.id === "fTarjeta") await guardarTarjeta(f);
    else if (f.id === "fItem") await guardarItem(f);
    else if (f.id === "fRep") await guardarRep(f);
    else if (f.id === "fAjustes") await guardarAjustes(f);
    else if (f.id === "fLinea"){
      const monto = num(f.querySelector("#ln-monto").value), err = f.querySelector("#ln-err");
      if (!(monto > 0)){ err.textContent = "Escribe un monto mayor a 0."; }
      else if (f.dataset.tipo === "abonos"){
        await guardarEvLineas(f.dataset.id, o => o.abonos.push({fecha:f.querySelector("#ln-fecha").value||hoy(), monto, forma:f.querySelector("#ln-forma").value, nota:f.querySelector("#ln-nota").value.trim()}), "Abono guardado");
      } else {
        const concepto = f.querySelector("#ln-concepto").value.trim();
        if (!concepto) err.textContent = "Escribe el concepto del costo.";
        else await guardarEvLineas(f.dataset.id, o => o.costos.push({concepto, monto}), "Costo guardado");
      }
    }
  } finally { if (btn.isConnected) btn.disabled = false; }
});

/* ---------- Conexión con la hoja de Google ---------- */
const LS_CONF = "eca-conexion", LS_CACHE = "eca-datos";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(_){ return null; } };
const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(_){} };
const nuevoId = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COLS = {eventos:"eventos", gastos:"gastos", tarjetas:"tarjetas", inventario:"inventario"};

async function api(accion, payload, conf){
  conf = conf || lsGet(LS_CONF);
  if (!conf) throw new Error("Sin conexión configurada");
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 25000);
  try {
    const r = await fetch(conf.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({accion, clave:conf.clave}, payload || {})), signal:ctrl.signal, redirect:"follow"});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Error de la hoja");
    return j;
  } finally { clearTimeout(t); }
}
function guardarCache(){ lsSet(LS_CACHE, {eventos:S.eventos, gastos:S.gastos, tarjetas:S.tarjetas, inventario:S.inventario, config:S.config}); }
function aplicarLocal(col, id, obj){
  const nuevo = Object.assign({id}, clone(obj)), arr = S[COLS[col]], i = arr.findIndex(x => x.id === id);
  S[COLS[col]] = i >= 0 ? arr.map(x => x.id === id ? nuevo : x) : [...arr, nuevo];
  guardarCache(); render();
}
function quitarLocal(col, id){ S[COLS[col]] = S[COLS[col]].filter(x => x.id !== id); guardarCache(); render(); }
function crearDb(){
  const ref = (col, id) => ({
    id,
    async set(obj){
      const datos = clone(obj);
      if (datos.tarjetaId) datos.tarjetaNombre = tarjetaNombre(tarjetaDe(datos.tarjetaId));
      await api("guardar", {col, id, datos});
      aplicarLocal(col, id, datos);
    },
    async delete(){ await api("borrar", {col, id}); quitarLocal(col, id); }
  });
  return {
    collection: col => ({ doc: id => ref(col, id || nuevoId()) }),
    doc: () => ({ async set(o){ await api("ajustes", {datos:o}); S.config = clone(o); guardarCache(); } })
  };
}
async function sincronizar(silencioso){
  try {
    const r = await api("todo");
    S.eventos = r.eventos || []; S.gastos = r.gastos || []; S.tarjetas = r.tarjetas || []; S.inventario = r.inventario || []; S.config = r.config || null;
    S.loaded = {e:true, g:true, t:true, c:true}; S.slow = false; S.errorMsg = "";
    guardarCache(); render();
    if (S.sheet && S.sheet.type === "evento") verEvento(S.sheet.id);
    if (S.sheet && S.sheet.type === "item") verItem(S.sheet.id);
  } catch(e){
    const msg = /Clave incorrecta/.test(e.message) ? "La clave ya no coincide con la de tu hoja. Desconecta este celular en Ajustes y vuelve a conectarlo." : "";
    if (!S.loaded.e){ S.slow = true; S.errorMsg = msg; render(); }
    else if (!silencioso) toast(msg || "Sin conexión. Te muestro lo último guardado.");
  }
}
function mostrarSetup(){
  $("#appRoot").hidden = true; $("#navRoot").hidden = true;
  const root = $("#setupRoot"); root.hidden = false;
  root.innerHTML = `<form class="setup" id="fSetup" novalidate>
    <div class="eyebrow">ECA MID</div>
    <h1>Conecta tu contabilidad</h1>
    <p>Pega el enlace de tu hoja (el que termina en <b>/exec</b>) y tu clave. Solo se hace una vez en este celular.</p>
    <div class="field"><label for="su-url">Enlace de la hoja</label><input id="su-url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field"><label for="su-clave">Clave</label><input id="su-clave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ECA-…"></div>
    <div class="err" id="su-err"></div>
    <button class="btn primary block" type="submit">Conectar</button>
  </form>`;
}
function ocultarSetup(){ $("#setupRoot").hidden = true; $("#setupRoot").innerHTML = ""; $("#appRoot").hidden = false; $("#navRoot").hidden = false; }
async function conectarSetup(form){
  const err = form.querySelector("#su-err");
  const conf = {url: form.querySelector("#su-url").value.trim(), clave: form.querySelector("#su-clave").value.trim()};
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(conf.url)) return err.textContent = "El enlace debe empezar con https://script.google.com/";
  if (!conf.clave) return err.textContent = "Escribe tu clave.";
  err.textContent = "Probando la conexión…";
  try { await api("todo", null, conf); }
  catch(e){ err.textContent = /Clave incorrecta/.test(e.message) ? "La clave no coincide con la de tu hoja." : "No se pudo conectar. Revisa el enlace y que la hoja esté implementada como app web."; return; }
  lsSet(LS_CONF, conf); ocultarSetup(); conectar();
}
function desconectar(btn){
  if (!btn.dataset.armed){ btn.dataset.armed = "1"; btn.textContent = "Toca otra vez para desconectar"; return; }
  lsSet(LS_CONF, null); lsSet(LS_CACHE, null); closeSheet();
  S.eventos = []; S.gastos = []; S.tarjetas = []; S.inventario = []; S.config = null; S.loaded = {e:false,g:false,t:false,c:false}; S.db = null;
  mostrarSetup();
}
function conectar(){
  if (!lsGet(LS_CONF)){ mostrarSetup(); return; }
  S.db = crearDb();
  const cache = lsGet(LS_CACHE);
  if (cache){ S.eventos = cache.eventos || []; S.gastos = cache.gastos || []; S.tarjetas = cache.tarjetas || []; S.inventario = cache.inventario || []; S.config = cache.config || null; S.loaded = {e:true,g:true,t:true,c:true}; }
  render();
  sincronizar(true);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.db && !S.sheet) sincronizar(true); });
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
conectar();
</script>
